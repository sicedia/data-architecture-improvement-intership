# Generated by `scrapagents generate-dbt` from configs/contracts/idrc/funding_opportunities.yml.
# Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_idrc__funding_opportunities
  description: 'One IDRC (International Development Research Centre, Canada) funding call as published
    on https://idrc-crdi.ca/en/funding, English version: title, status, deadline, programme, funder, budget
    and call text. Read from the public RSS feed (primary path) and from the HTML listing and detail pages
    for calls the feed no longer carries. Content (c) IDRC: attribution (IDRC, the source_url and retrieved_at)
    travels with every record. Data minimization: staff contact emails are not extracted and emails inside
    the call text are redacted by the extractor. Current version: latest ingested row per primary key
    (call_slug).'
  meta:
    layer: intermediate
    owner: data_team_sistemas_internos
    source_system: idrc
    dataset: funding_opportunities
    grain: one funding call, identified by the slug of its detail page, in one read of the source
    generated: true
  columns:
  - name: call_slug
    description: Last path segment of the call detail URL, /en/funding/<slug>. It is present in both the
      RSS item link and the listing link, so a call keeps the same key whichever path produced it.
    meta:
      classification: public
    data_tests:
    - not_null
    - unique
  - name: source_url
    description: Absolute URL of the call detail page on idrc-crdi.ca (attribution to the source page).
    meta:
      classification: public
    data_tests:
    - not_null
  - name: node_id
    description: Drupal node id (numeric part of the RSS guid, for example 147196). Null when the call
      was read only from the HTML pages and the page does not expose it; it is not part of the key.
    meta:
      classification: public
  - name: title
    description: Title of the funding call.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: status
    description: 'Status label of the call as the source shows it (Open or Closed): the listing section
      or the Status field of the detail page. It changes when the deadline passes without any edit.'
    meta:
      classification: public
    data_tests:
    - not_null
  - name: call_type
    description: Kind of call (Applications, Proposals, Expressions of interest, Letters of interest,
      Concept notes).
    meta:
      classification: public
  - name: deadline
    description: Application deadline in UTC, from the datetime attribute of the deadline element. Null
      when the call has none.
    meta:
      classification: public
  - name: program
    description: IDRC programme that runs the call. Several values are joined with "; " in page order.
    meta:
      classification: public
  - name: duration
    description: Duration of the award as written by the source (free text).
    meta:
      classification: public
  - name: topic
    description: Topic(s) of the call. Several values are joined with "; " in page order.
    meta:
      classification: public
  - name: funded_by
    description: Funder(s) of the call as written by the source (free text, not a Party identifier).
    meta:
      classification: public
  - name: budget
    description: Budget or award amount as written by the source (free text, currency included); not parsed
      into a number.
    meta:
      classification: public
  - name: award_type
    description: Type of award, for example Student award.
    meta:
      classification: public
  - name: description_text
    description: Plain text of the call body (scope, eligibility, more details), converted from the HTML
      by the extractor with fixed rules; email addresses replaced by a placeholder.
    meta:
      classification: personal
      purpose: Call scope and eligibility text, needed to match opportunities to research profiles. It
        may incidentally name IDRC staff or programme contacts; emails are redacted by the extractor and
        the column must not feed Party or be exposed outside the platform.
    tags:
    - pii
  - name: feed_published_at
    description: 'pubDate of the RSS item. Null for a call that is no longer in the feed. Listed in persistence.ignore_fields:
      it is not accepted as a change signal and it disappears when the call leaves the 10-item feed.'
    meta:
      classification: public
  - name: extraction_path
    description: 'How the record was read in this run: rss (feed item) or html (listing plus detail page).
      Provenance only; listed in persistence.ignore_fields.'
    meta:
      classification: public
    data_tests:
    - not_null
  - name: retrieved_at
    description: UTC time the extractor read the call (the source does not guarantee its content is current).
      Listed in persistence.ignore_fields.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: bronze_batch_id
    description: Batch (landed payload) this record came from; same bytes, same batch.
    data_tests:
    - not_null
  - name: bronze_record_hash
    description: SHA-256 of the record as landed, to detect changes between batches.
    data_tests:
    - not_null
  - name: bronze_landing_uri
    description: Landing object the record was read from (provenance).
    data_tests:
    - not_null
  - name: bronze_ingested_at
    description: When the RustWorker loaded that payload into bronze.
    data_tests:
    - not_null
