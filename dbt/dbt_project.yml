name: scrapagents_oi
version: "1.0.0"
config-version: 2
profile: scrapagents

model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]

# Five-layer lineage: Landing (RustFS) -> bronze (PostgreSQL) -> staging -> intermediate -> Producto OI.
# Staging and intermediate models are generated from data contracts (`make generate-dbt`).
models:
  scrapagents_oi:
    +materialized: table
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    producto_oi:
      +schema: producto_oi
