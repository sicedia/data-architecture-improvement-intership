# ScrapAgents Unified Local Infrastructure (Single Docker Compose)
# Consolidates Warehouse, Ingestion, Orchestration, and Transformation into a single Compose project.
# Every service specifies an explicit `container_name` following the CEDIA data platform pattern.
name: scrapagents

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: ${PLATFORM_TIMEZONE:-America/Guayaquil}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-36B3Ligp58zI_waeeuplaDjkQ79rJ9SlHeB9cRMH-ug=}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-change-me-local-only}@airflow-db:5432/airflow
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-only-jwt-secret-0123456789}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-change-me-local-only}
  AIRFLOW__DAG_PROCESSOR__DAG_IMPORTER_CONFIGS: '[{"classpath": "airflow.sdk.importers.yaml_importer.YamlDagImporter"}]'
  RUNTIME_URL: http://source-runtime:8088
  OBSCURA_CDP_URL: http://obscura:9222
  OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:-}
  SCRAPAGENTS_CONFIG_ROOT: /opt/scrapagents
  DBT_BIN: /opt/dbt-venv/bin/dbt
  DBT_PROJECT_DIR: /opt/airflow/dbt
  DBT_PROFILES_DIR: /opt/airflow/dbt
  DBT_TARGET_PATH: /tmp/dbt/target
  DBT_LOG_PATH: /tmp/dbt/logs
  DBT_HOST: postgres
  DBT_PORT: "5432"
  DBT_USER: ${POSTGRES_USER:-scrapagents}
  DBT_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
  DBT_DBNAME: ${POSTGRES_DB:-scrapagents}

x-airflow: &airflow
  image: scrapagents-airflow:${AIRFLOW_VERSION:-3.4.0}-py${AIRFLOW_PYTHON:-3.12}
  build:
    context: .
    dockerfile: infra/orchestration/Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.4.0}
      AIRFLOW_PYTHON: ${AIRFLOW_PYTHON:-3.12}
  environment: *airflow-env
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./dbt:/opt/airflow/dbt:ro
    - airflow_logs:/opt/airflow/logs
  networks: [scrapagents_net]

services:
  # =========================================================================
  # 1. Warehouse & Storage Layer (PostgreSQL & RustFS Landing S3)
  # =========================================================================
  postgres:
    container_name: scrapagents-postgres
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrapagents}
      POSTGRES_USER: ${POSTGRES_USER:-scrapagents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/warehouse/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrapagents} -d ${POSTGRES_DB:-scrapagents}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [scrapagents_net]

  rustfs:
    container_name: scrapagents-rustfs
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.4}
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-scrapagents}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-change-me-local-only}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:${RUSTFS_S3_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    networks: [scrapagents_net]

  # =========================================================================
  # 2. Ingestion & Runtime Layer (Apache Tika, SourceRuntime, Obscura)
  # =========================================================================
  tika:
    container_name: scrapagents-tika
    image: apache/tika:${TIKA_VERSION:-4.1.0}
    ports:
      - "127.0.0.1:${TIKA_PORT:-9998}:9998"
    networks: [scrapagents_net]

  source-runtime:
    container_name: scrapagents-source-runtime
    build:
      context: ./rust/source_runtime
    environment:
      RUNTIME_BIND: 0.0.0.0:8088
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: landing
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-scrapagents}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-change-me-local-only}
      DATABASE_URL: postgres://${POSTGRES_USER:-scrapagents}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-scrapagents}
      TIKA_URL: http://tika:9998
      BRONZE_REGISTRY: /etc/source_runtime/bronze_registry.json
    volumes:
      - ./bronze/registry.json:/etc/source_runtime/bronze_registry.json:ro
    ports:
      - "127.0.0.1:${RUNTIME_PORT:-8088}:8088"
    depends_on:
      rustfs:
        condition: service_started
      tika:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: on-failure
    networks: [scrapagents_net]

  obscura:
    container_name: scrapagents-obscura
    image: h4ckf0r0day/obscura:0.2.6
    # Obscura has no --ignore-certificate-errors / danger_accept_invalid_certs switch.
    # TLS is always verified; incomplete chains (e.g. CAF / Sectigo R36) need extra CAs.
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?set OBSCURA_CDP_TOKEN in .env (at least 32 bytes)}
      # Image default roots + extras mounted below (see infra/obscura/README.md).
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/obscura/extra-cas
    volumes:
      - ./infra/obscura/certs/extra:/etc/obscura/extra-cas:ro
    # Explicit serve flags (same defaults as the image entrypoint, documented here).
    command:
      [
        "serve",
        "--port",
        "9222",
        "--host",
        "0.0.0.0",
        "--stealth",
      ]
    ports:
      - "127.0.0.1:9222:9222"
    restart: on-failure
    networks: [scrapagents_net]

  # =========================================================================
  # 3. Airflow Orchestration Layer
  # =========================================================================
  airflow-db:
    container_name: scrapagents-airflow-db
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-change-me-local-only}
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [scrapagents_net]

  airflow-init:
    container_name: scrapagents-airflow-init
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate && airflow pools import /opt/airflow/dags/_pools.json"]
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    container_name: scrapagents-airflow-api-server
    <<: *airflow
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  airflow-scheduler:
    container_name: scrapagents-airflow-scheduler
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    container_name: scrapagents-airflow-dag-processor
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # =========================================================================
  # 4. Transformation Layer (dbt CLI Tools)
  # =========================================================================
  dbt:
    container_name: scrapagents-dbt
    profiles: [tools]
    image: scrapagents-dbt:${DBT_CORE_VERSION:-1.12.3}
    build:
      context: .
      dockerfile: infra/transformation/Dockerfile
    working_dir: /dbt
    environment:
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: ${POSTGRES_USER:-scrapagents}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      DBT_DBNAME: ${POSTGRES_DB:-scrapagents}
      DBT_PROFILES_DIR: /dbt
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
    volumes:
      - ./dbt:/dbt:ro
    networks: [scrapagents_net]

volumes:
  postgres_data:
  rustfs_data:
  airflow_db:
  airflow_logs:

networks:
  scrapagents_net:
    name: scrapagents_net
