# Generated by `scrapagents generate-dags` from configs/ingestions/caf.yml.
# Do not edit by hand: change the source config and regenerate (`make generate-dags`).
# Declarative only (Airflow YAML importer, AIP-85): no Python and no LLM at run-time.
$schema: https://airflow.apache.org/schemas/dag/2026-10-30.json
dag_id: ingest__caf
description: "Ingesta automatizada de convocatorias y oportunidades de adquisición y consultoría publicadas por CAF."
schedule: "0 7 * * 1"
start_date: 2026-01-01
catchup: false
max_active_runs: 1
tags: ["ingestion", "source_caf", "web", "sistemas_internos"]
tasks:
  - id: runtime_ready
    uses: airflow.providers.standard.operators.bash.BashOperator
    retries: 2
    retry_delay: 5m
    with:
      bash_command: "python -m scrapagents.cli check-runtime"
  - id: land__convocatorias
    needs: [runtime_ready]
    uses: airflow.providers.standard.operators.bash.BashOperator
    pool: "caf_source"
    retries: 2
    retry_delay: 5m
    execution_timeout: 1h
    with:
      bash_command:
        $t: "python -m scrapagents.extractors.caf --dataset convocatorias --ingest-date {{ (dag_run.logical_date or dag_run.run_after).strftime('%Y-%m-%d') }}"
  - id: landed
    needs: ["land__convocatorias"]
    uses: airflow.providers.standard.operators.empty.EmptyOperator
  - id: dbt_build
    needs: [landed]
    uses: airflow.providers.standard.operators.bash.BashOperator
    retries: 2
    retry_delay: 5m
    with:
      bash_command: "cd \"$DBT_PROJECT_DIR\" && \"$DBT_BIN\" build --select tag:source_caf"
