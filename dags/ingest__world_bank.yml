# Declarative only (Airflow YAML importer, AIP-85): no Python and no LLM at run-time.
$schema: https://airflow.apache.org/schemas/dag/2026-10-30.json
dag_id: ingest__world_bank
description: "Ingesta determinista de avisos de adquisiciones, licitaciones y consultorías (REOI/IFB) publicados por el Banco Mundial."
schedule: "0 6 * * *"
start_date: 2026-01-01
catchup: false
max_active_runs: 1
tags: ["ingestion", "source_world_bank", "web", "sistemas_internos"]
tasks:
  - id: runtime_ready
    uses: airflow.providers.standard.operators.bash.BashOperator
    retries: 2
    retry_delay: 5m
    with:
      bash_command: "python -m scrapagents.cli check-runtime"
  - id: land__opportunities
    needs: [runtime_ready]
    uses: airflow.providers.standard.operators.bash.BashOperator
    pool: "world_bank_web"
    retries: 2
    retry_delay: 5m
    execution_timeout: 1h
    with:
      bash_command:
        $t: "python -m scrapagents.extractors.world_bank --dataset opportunities --ingest-date {{ (dag_run.logical_date or dag_run.run_after).strftime('%Y-%m-%d') }}"
  - id: landed
    needs: ["land__opportunities"]
    uses: airflow.providers.standard.operators.empty.EmptyOperator
  - id: dbt_build
    needs: [landed]
    uses: airflow.providers.standard.operators.bash.BashOperator
    retries: 2
    retry_delay: 5m
    with:
      bash_command: "cd \"$DBT_PROJECT_DIR\" && \"$DBT_BIN\" build --select tag:source_world_bank"
