[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapagents"
version = "0.1.0"
description = "Producto OI harness: contracts, design-time dossiers, stealth probes and deterministic extractors."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
probes = ["playwright>=1.45"]
extractors = ["beautifulsoup4>=4.12", "playwright==1.64.1"]
smoke = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
scrapagents = "scrapagents.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"scrapagents.dags" = ["templates/*.j2"]
"scrapagents.dbt" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ingestions/_template"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
