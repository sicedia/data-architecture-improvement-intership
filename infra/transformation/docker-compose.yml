# Stack "transformation": dbt Core on PostgreSQL (warehouse stack). A tool container, not a
# service: run it with `make dbt CMD="build"` (the `tools` profile keeps `up` from starting it).
name: scrapagents-transformation

services:
  dbt:
    profiles: [tools]
    image: scrapagents-dbt:${DBT_CORE_VERSION}
    build:
      context: ../..
      dockerfile: infra/transformation/Dockerfile
    working_dir: /dbt
    environment:
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: ${POSTGRES_USER}
      DBT_PASSWORD: ${POSTGRES_PASSWORD}
      DBT_DBNAME: ${POSTGRES_DB}
      DBT_PROFILES_DIR: /dbt
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
    volumes:
      - ../../dbt:/dbt:ro
    networks: [scrapagents_net]

networks:
  scrapagents_net:
    external: true
