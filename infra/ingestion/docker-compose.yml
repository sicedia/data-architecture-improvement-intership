# Stack "ingestion": RustFS (Landing, S3), Apache Tika and, with `--profile browser`, Obscura.
# The RustWorker (`source-runtime`) sits in front of RustFS: complex binaries (PDF, DOCX) go through
# Tika before loading, everything else loads directly (invariant 4). It also writes to PostgreSQL
# (`bronze`) in the `warehouse` stack, reached over the shared network: start `warehouse` first.
name: scrapagents-ingestion

services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:${RUSTFS_S3_PORT}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT}:9001"
    volumes:
      - rustfs_data:/data
    networks: [scrapagents_net]

  tika:
    image: apache/tika:${TIKA_VERSION}
    # Montar una configuración personalizada si necesitas extender taskTimeoutMillis
    # volumes:
    #   - ./tika-config.xml:/tika-config.xml
    # command: ["-c", "/tika-config.xml"]
    ports:
      - "127.0.0.1:${TIKA_PORT}:9998"
    networks: [scrapagents_net]


  source-runtime:
    build:
      context: ../../rust/source_runtime
    environment:
      RUNTIME_BIND: 0.0.0.0:8088
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: landing
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TIKA_URL: http://tika:9998
      # Design-time registry of the datasets that have a typed bronze table (make generate-bronze).
      BRONZE_REGISTRY: /etc/source_runtime/bronze_registry.json
    volumes:
      - ../../bronze/registry.json:/etc/source_runtime/bronze_registry.json:ro
    ports:
      - "127.0.0.1:${RUNTIME_PORT}:8088"
    depends_on: [rustfs, tika]
    restart: on-failure
    networks: [scrapagents_net]

  obscura:
    # Headless browser in Rust (invariant 3). Playwright connects to it over CDP; it refuses to serve
    # without a token of at least 32 bytes. Opt-in profile, token from the shell, never from a file:
    #   export OBSCURA_CDP_TOKEN="$(openssl rand -hex 32)"
    #   docker compose --env-file infra/.env -f infra/ingestion/docker-compose.yml --profile browser up -d obscura
    profiles: [browser]
    image: h4ckf0r0day/obscura:0.2.6
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?export OBSCURA_CDP_TOKEN (at least 32 bytes) first}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    ports:
      - "127.0.0.1:9222:9222"
    networks: [scrapagents_net]

volumes:
  rustfs_data:

networks:
  scrapagents_net:
    external: true
